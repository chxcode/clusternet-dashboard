name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v0.1.0'
        required: true
        type: string

permissions:
  contents: read

env:
  IMAGE_REPOSITORY: docker.io/changxuan/clusternet-dashboard
  CHART_PATH: charts/clusternet-dashboard
  CHART_OCI_NAMESPACE: oci://registry-1.docker.io/changxuan

jobs:
  release:
    name: Build and publish image and Helm chart
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive release version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            release_tag="${{ inputs.tag }}"
          else
            release_tag="${GITHUB_REF_NAME}"
          fi

          if [[ ! "${release_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must look like v0.1.0 or v0.1.0-rc.1, got: ${release_tag}" >&2
            exit 1
          fi

          chart_version="${release_tag#v}"
          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "chart_version=${chart_version}" >> "$GITHUB_OUTPUT"
          echo "RELEASE_TAG=${release_tag}" >> "$GITHUB_ENV"
          echo "CHART_VERSION=${chart_version}" >> "$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Install frontend dependencies
        run: npm ci --prefix web

      - name: Run verification
        run: |
          npm audit --prefix web --audit-level=high
          npm test --prefix web
          npm run build --prefix web
          go test ./...
          helm lint "$CHART_PATH"

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub for image push
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push multi-architecture image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            DASHBOARD_VERSION=${{ steps.version.outputs.release_tag }}
          tags: |
            ${{ env.IMAGE_REPOSITORY }}:${{ steps.version.outputs.release_tag }}
            ${{ env.IMAGE_REPOSITORY }}:latest
          labels: |
            org.opencontainers.image.title=clusternet-dashboard
            org.opencontainers.image.description=A lightweight dashboard for Clusternet
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.release_tag }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Prepare Helm chart release values
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          release_tag = os.environ['RELEASE_TAG']
          values_path = Path(os.environ['CHART_PATH']) / 'values.yaml'
          text = values_path.read_text()
          text = re.sub(r'(?m)^(\s*repository:\s*).+$', r'\1changxuan/clusternet-dashboard', text, count=1)
          text = re.sub(r'(?m)^(\s*tag:\s*).+$', rf'\1{release_tag}', text, count=1)
          values_path.write_text(text)
          PY

      - name: Package Helm chart
        shell: bash
        run: |
          mkdir -p dist
          helm package "$CHART_PATH" \
            --version "$CHART_VERSION" \
            --app-version "$RELEASE_TAG" \
            --destination dist

      - name: Login to Docker Hub for Helm OCI push
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "$DOCKERHUB_TOKEN" | helm registry login registry-1.docker.io \
            --username "$DOCKERHUB_USERNAME" \
            --password-stdin

      - name: Push Helm chart to Docker Hub OCI registry
        shell: bash
        run: |
          chart_package="dist/clusternet-dashboard-${CHART_VERSION}.tgz"
          helm push "$chart_package" "$CHART_OCI_NAMESPACE"
          helm show chart "oci://registry-1.docker.io/changxuan/clusternet-dashboard" \
            --version "$CHART_VERSION"

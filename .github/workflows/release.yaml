name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag recorded in this checkout, for example v1.2.3'
        required: true
        type: string
      build_existing_tag:
        description: 'Build the source at the existing Git tag'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-clusternet-dashboard
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: docker.io/changxuan/clusternet-dashboard
  CHART_PATH: charts/clusternet-dashboard
  CHART_OCI_NAMESPACE: oci://registry-1.docker.io/changxuan

jobs:
  release:
    name: Build and publish image and Helm chart
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.build_existing_tag && format('refs/tags/{0}', inputs.tag) || github.sha }}

      - name: Check release version
        id: version
        shell: bash
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            release_tag="$DISPATCH_TAG"
          else
            release_tag="$GITHUB_REF_NAME"
          fi
          python3 scripts/release-version.py check "$release_tag"

          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "CHART_VERSION=${release_tag#v}" >> "$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Install frontend dependencies
        run: npm ci --prefix web

      - name: Run verification
        run: |
          npm audit --prefix web --audit-level=high
          npm test --prefix web
          npm run build --prefix web
          go test ./...
          helm lint "$CHART_PATH"

      - name: Prepare verified frontend for both image platforms
        run: |
          test -s web/dist/index.html
          mkdir -p "$RUNNER_TEMP/dashboard-web/src/web"
          cp -R web/dist "$RUNNER_TEMP/dashboard-web/src/web/"

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub for image push
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push multi-architecture image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-contexts: |
            web-builder=${{ runner.temp }}/dashboard-web
          build-args: |
            DASHBOARD_VERSION=${{ steps.version.outputs.release_tag }}
          tags: |
            ${{ env.IMAGE_REPOSITORY }}:${{ steps.version.outputs.release_tag }}
            ${{ env.IMAGE_REPOSITORY }}:latest
          labels: |
            org.opencontainers.image.title=clusternet-dashboard
            org.opencontainers.image.description=A lightweight dashboard for Clusternet
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.release_tag }}
            org.opencontainers.image.revision=${{ steps.version.outputs.revision }}

      - name: Package Helm chart
        shell: bash
        run: |
          mkdir -p dist
          helm package "$CHART_PATH" --destination dist

      - name: Login to Docker Hub for Helm OCI push
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "$DOCKERHUB_TOKEN" | helm registry login registry-1.docker.io \
            --username "$DOCKERHUB_USERNAME" \
            --password-stdin

      - name: Push Helm chart to Docker Hub OCI registry
        shell: bash
        run: |
          chart_package="dist/clusternet-dashboard-${CHART_VERSION}.tgz"
          helm push "$chart_package" "$CHART_OCI_NAMESPACE"
          helm show chart "oci://registry-1.docker.io/changxuan/clusternet-dashboard" \
            --version "$CHART_VERSION"

image:
  repository: changxuan/clusternet-dashboard
  tag: v0.2.0
  pullPolicy: IfNotPresent

imagePullSecrets: []

labelEditing:
  enabled: false
  allowedHosts: [] # Additional public hostnames for authenticated reverse proxies.

registrationOperations:
  deleteFailedRequests: false

releaseOperations:
  publishNativeWorkloads: false
  deployCharts: false
  editChartSources: false
  triage: false
  chartVersionEditing: false
  deleteFailedRelease: false
  allowedHosts: []

replicaCount: 1

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""

rbac:
  create: true

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  ingressClassName: ""
  host: ""
  path: /clusternet

env:
  basePath: ""
  parentClusterName: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi
